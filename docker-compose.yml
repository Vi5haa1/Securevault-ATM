version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: securevault-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: securevault_pwd
      MYSQL_DATABASE: securevault_atm
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecurevault_pwd"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: securevault-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: securevault-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: mysql+aiomysql://root:securevault_pwd@mysql:3306/securevault_atm
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: securevault_super_secret_jwt_key_production_environment_random_seed
      FERNET_KEY: bGFyZ2VzZWNyZXRrZXlmb3JmZXJuZXQxMjM0NTY3ODkwMTI=
      ENVIRONMENT: production
      DEBUG: "false"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securevault-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
