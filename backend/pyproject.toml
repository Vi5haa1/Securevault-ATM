[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securevault-atm"
version = "1.0.0"
description = "SecureVault ATM - Enterprise Cybersecurity ATM & SOC Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.20.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "pyotp>=2.9.0",
    "slowapi>=0.1.9",
    "apscheduler>=3.10.4",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "reportlab>=4.2.0",
    "typer>=0.12.3",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
